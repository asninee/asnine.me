name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: description
    runs-on: ubuntu-latest
    steps:
      - name: Validate required sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --input-type=module <<'EOF'
          const body = process.env.PR_BODY ?? ''
          const hasContent = heading =>
            new RegExp(`^## ${heading}\\s*\\n(?:\\s*-\\s+\\S.*\\n?)+`, 'm').test(body)
          const hasSummary = hasContent('Summary')
          const hasWhatAndWhy = hasContent('What') && hasContent('Why')
          const hasValidation = /^## Validation\s*\n(?:\s*-\s+\[[ xX]\]\s+\S.*\n?)+/m.test(body)

          if (!hasSummary && !hasWhatAndWhy) {
            console.error('PR description must include a non-empty Summary section or both What and Why sections.')
            process.exit(1)
          }

          if (!hasValidation) {
            console.error('PR description must include a non-empty Validation section.')
            process.exit(1)
          }
          EOF
