name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: description
    runs-on: ubuntu-latest
    steps:
      - name: Validate release naming
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node --input-type=module <<'EOF'
          const title = process.env.PR_TITLE ?? ''
          const branch = process.env.PR_BRANCH ?? ''
          const version = String.raw`(\d+\.\d+\.\d+)`
          const titleMatch = new RegExp(`^chore\\(release\\): ${version}$`).exec(title)
          const branchMatch = new RegExp(`^release/${version}$`).exec(branch)

          if (!titleMatch && !branchMatch) process.exit(0)

          if (!titleMatch || !branchMatch || titleMatch[1] !== branchMatch[1]) {
            console.error(
              'release pull requests must use matching `chore(release): x.y.z` titles and `release/x.y.z` branches.'
            )
            process.exit(1)
          }
          EOF

      - name: Validate required sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --input-type=module <<'EOF'
          const body = process.env.PR_BODY ?? ''
          const hasContent = heading =>
            new RegExp(`^## ${heading}\\s*\\n(?:\\s*-\\s+\\S.*\\n?)+`, 'm').test(body)
          const hasSummary = hasContent('summary')
          const hasWhatAndWhy = hasContent('what') && hasContent('why')
          const hasValidation = /^## validation\s*\n(?:\s*-\s+\[[ xX]\]\s+\S.*\n?)+/m.test(body)

          if (!hasSummary && !hasWhatAndWhy) {
            console.error('pr description must include a non-empty summary section or both what and why sections.')
            process.exit(1)
          }

          if (!hasValidation) {
            console.error('pr description must include a non-empty validation section.')
            process.exit(1)
          }
          EOF
