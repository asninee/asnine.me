name: snapshot

on:
  check_run:
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    if: >-
      github.event.check_run.name == 'Cloudflare Pages' &&
      github.event.check_run.app.name == 'Cloudflare Workers and Pages' &&
      github.event.check_run.conclusion == 'success' &&
      github.event.check_run.head_sha == github.sha
    runs-on: ubuntu-latest
    concurrency:
      group: record-deployment-snapshot
      cancel-in-progress: true
    steps:
      - name: Check out deployment
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.check_run.head_sha }}

      - name: Record deployment URL
        env:
          DEPLOYMENT_SUMMARY: ${{ github.event.check_run.output.summary }}
        run: node scripts/record-deployment-snapshot.mjs

      - name: Commit changelog update
        env:
          DEPLOYMENT_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          if git diff --quiet -- src/content/blog/changelog.mdx; then
            exit 0
          fi

          remote_ref=$(git ls-remote --exit-code origin refs/heads/main)
          remote_sha=${remote_ref%%[[:space:]]*}
          if [ "$remote_sha" != "$DEPLOYMENT_SHA" ]; then
            echo 'Skipping snapshot for a superseded deployment.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/blog/changelog.mdx
          git commit -m 'chore: record deployment snapshot [skip ci]'
          git push origin HEAD:main
