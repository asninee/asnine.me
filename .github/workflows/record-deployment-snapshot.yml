name: snapshot

on:
  deployment_status:

permissions:
  contents: write

jobs:
  record:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.ref == 'main' &&
      github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    concurrency:
      group: record-deployment-snapshot
      cancel-in-progress: false
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Confirm deployment is current
        env:
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DEPLOYMENT_SHA"

      - name: Record deployment URL
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: node scripts/record-deployment-snapshot.mjs

      - name: Commit changelog update
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/blog/changelog.mdx
          git commit -m 'chore: record deployment snapshot [skip ci]'
          git push origin HEAD:main
